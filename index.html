ibed for you as it was prescribed for those before you, so that you may become mindful of Allah.", "Ô vous qui croyez, le jeûne vous a été prescrit comme il a été prescrit à ceux d'avant vous, ainsi atteindrez-vous la piété."], "2:43": ["وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ", "Establish prayer, give zakat, and bow with those who bow.", "Accomplissez la prière, acquittez la zakat et inclinez-vous avec ceux qui s'inclinent."], "107:4–5": ["فَوَيْلٌ لِّلْمُصَلِّينَ • الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ", "Woe to those who pray, who are heedless of their prayer.", "Malheur à ceux qui prient tout en négligeant leur prière."], "23:3": ["وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "(The successful believers are) those who turn away from idle talk.", "(Les croyants qui réussissent sont) ceux qui se détournent des futilités."], "24:30–31": ["قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ • وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ", "Tell the believing men to lower their gaze and guard their chastity… And tell the believing women to lower their gaze.", "Dis aux croyants de baisser leurs regards et de garder leur chasteté… Et dis aux croyantes de baisser leurs regards."], "74:42–43": ["مَا سَلَكَكُمْ فِي سَقَرَ • قَالُوا لَمْ نَكُ مِنَ الْمُصَلِّينَ", "“What brought you into Saqar?” They will say: “We were not of those who prayed.”", "« Qu'est-ce qui vous a menés à Saqar ? » Ils diront : « Nous n'étions pas de ceux qui priaient. »"], "9:34–35": ["وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنفِقُونَهَا فِي سَبِيلِ اللَّهِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ", "Those who hoard gold and silver and do not spend it in the way of Allah — give them tidings of a painful punishment.", "Ceux qui thésaurisent l'or et l'argent sans les dépenser dans le sentier d'Allah, annonce-leur un châtiment douloureux."], "2:183–185": ["فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ", "So whoever of you witnesses the month (of Ramadan), let him fast it.", "Quiconque d'entre vous est présent en ce mois (de Ramadan), qu'il jeûne."], "17:32": ["وَلَا تَقْرَبُوا الزِّنَىٰ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا", "Do not come near zina; it is an indecency and an evil way.", "N'approchez pas la fornication ; c'est une turpitude et quel mauvais chemin !"], "24:30": ["قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ذَٰلِكَ أَزْكَىٰ لَهُمْ", "Tell the believing men to lower their gaze and guard their chastity; that is purer for them.", "Dis aux croyants de baisser leurs regards et de garder leur chasteté ; c'est plus pur pour eux."], "2:102": ["وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ", "They knew well that whoever buys it (magic) has no share in the Hereafter.", "Ils savaient bien que celui qui l'acquiert (la magie) n'aura aucune part dans l'au-delà."], "5:90–91": ["إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ", "Intoxicants, gambling, idols and divining arrows are filth from the work of Satan, so avoid them that you may succeed.", "Le vin, les jeux de hasard, les pierres dressées et les flèches divinatoires sont une souillure, œuvre du Diable ; écartez-vous-en afin de réussir."], "5:90": ["إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ", "Intoxicants, gambling, idols and divining arrows are filth from the work of Satan, so avoid them.", "Le vin, les jeux de hasard, les pierres dressées et les flèches divinatoires sont une souillure, œuvre du Diable ; écartez-vous-en."], "24:4": ["وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا", "Those who accuse chaste women and do not bring four witnesses — flog them eighty lashes and never accept their testimony.", "Ceux qui accusent des femmes chastes sans produire quatre témoins, fouettez-les de quatre-vingts coups et n'acceptez plus jamais leur témoignage."], "17:23–24": ["وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا • وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ", "Your Lord has decreed that you worship none but Him, and that you be excellent to parents… and lower to them the wing of humility out of mercy.", "Ton Seigneur a décrété que vous n'adoriez que Lui et que vous soyez bons envers les parents… et abaisse pour eux l'aile de l'humilité, par miséricorde."], "2:233": ["وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ", "The father must provide for them (mother and child) and clothe them in a fair manner.", "Au père de l'enfant de les nourrir et de les vêtir de manière convenable."], "24:22": ["وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ", "Let them pardon and overlook. Do you not love that Allah should forgive you?", "Qu'ils pardonnent et passent outre. N'aimez-vous pas qu'Allah vous pardonne ?"], "31:19": ["وَاقْصِدْ فِي مَشْيِكَ وَاغْضُضْ مِن صَوْتِكَ إِنَّ أَنكَرَ الْأَصْوَاتِ لَصَوْتُ الْحَمِيرِ", "Be moderate in your walk and lower your voice; the most hateful of voices is the braying of donkeys.", "Sois modeste dans ta démarche et baisse ta voix ; la plus détestable des voix est celle des ânes."], "49:11": ["يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ عَسَىٰ أَن يَكُونُوا خَيْرًا مِّنْهُمْ", "O you who believe, let no people mock another people; perhaps they are better than them.", "Ô vous qui croyez, qu'un groupe ne se moque pas d'un autre ; ceux-ci sont peut-être meilleurs qu'eux."], "17:23": ["فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا", "Do not say to them even “uff”, nor scold them, but speak to them with noble words.", "Ne leur dis même pas « fi ! », ne les brusque pas, et adresse-leur des paroles respectueuses."], "25:67": ["وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا", "Those who, when they spend, are neither extravagant nor stingy, but hold a just balance between the two.", "Ceux qui, lorsqu'ils dépensent, ne sont ni prodigues ni avares, mais gardent le juste milieu."], "103:1–3": ["وَالْعَصْرِ • إِنَّ الْإِنسَانَ لَفِي خُسْرٍ • إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ", "By time! Mankind is surely in loss, except those who believe, do good deeds, and urge one another to truth and to patience.", "Par le Temps ! L'homme est certes en perdition, sauf ceux qui croient, font de bonnes œuvres et s'enjoignent la vérité et la patience."], "17:29": ["وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا", "Do not tie your hand to your neck, nor stretch it out fully, or you will end up blamed and regretful.", "Ne garde pas ta main attachée à ton cou, et ne l'étends pas non plus complètement, sinon tu te retrouveras blâmé et démuni."], "17:26–27": ["وَلَا تُبَذِّرْ تَبْذِيرًا • إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ", "Do not squander wastefully. Indeed, the squanderers are brothers of the devils.", "Ne gaspille pas indûment. Les gaspilleurs sont les frères des diables."], "30:21": ["وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً", "Among His signs is that He created spouses for you from yourselves, that you may find tranquillity in them, and He placed between you affection and mercy.", "Parmi Ses signes, Il a créé de vous des épouses pour que vous trouviez auprès d'elles la quiétude, et Il a mis entre vous affection et bonté."], "47:22–23": ["فَهَلْ عَسَيْتُمْ إِن تَوَلَّيْتُمْ أَن تُفْسِدُوا فِي الْأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ • أُولَٰئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ", "If you turned away, would you then spread corruption in the land and sever your ties of kinship? Those are the ones Allah has cursed.", "Si vous vous détourniez, sèmeriez-vous la corruption sur terre et rompriez-vous vos liens de parenté ? Ce sont eux qu'Allah a maudits."], "4:10": ["إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَىٰ ظُلْمًا إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَارًا وَسَيَصْلَوْنَ سَعِيرًا", "Those who unjustly consume the wealth of orphans only consume fire into their bellies, and they will burn in a blaze.", "Ceux qui mangent injustement les biens des orphelins ne font que manger du feu dans leurs ventres ; ils brûleront dans un brasier."], "4:58": ["إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ", "Allah commands you to render trusts to whom they are due, and when you judge between people, to judge with justice.", "Allah vous commande de rendre les dépôts à leurs ayants droit et, quand vous jugez entre les gens, de juger avec équité."], "5:2": ["وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ", "Cooperate in righteousness and piety, and do not cooperate in sin and aggression.", "Entraidez-vous dans la bonté et la piété, et ne vous entraidez pas dans le péché et la transgression."], "4:135": ["يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ", "O you who believe, stand firmly for justice as witnesses for Allah, even if it is against yourselves.", "Ô vous qui croyez, observez strictement la justice et soyez des témoins pour Allah, fût-ce contre vous-mêmes."], "5:32": ["وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا", "Whoever saves one life, it is as if he has saved all of mankind.", "Quiconque sauve une vie, c'est comme s'il avait sauvé l'humanité entière."], "83:1–3": ["وَيْلٌ لِّلْمُطَفِّفِينَ • الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ • وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ", "Woe to those who give short measure — who take full measure from people, but give them less when they measure or weigh for them.", "Malheur aux fraudeurs — qui exigent la pleine mesure des gens, mais leur donnent moins quand ils mesurent ou pèsent pour eux."], "8:27": ["يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَخُونُوا اللَّهَ وَالرَّسُولَ وَتَخُونُوا أَمَانَاتِكُمْ وَأَنتُمْ تَعْلَمُونَ", "O you who believe, do not betray Allah and the Messenger, nor knowingly betray your trusts.", "Ô vous qui croyez, ne trahissez pas Allah et le Messager, et ne trahissez pas sciemment vos dépôts."], "17:34": ["وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا", "Fulfil every commitment; you will be questioned about commitments.", "Respectez vos engagements ; on vous en demandera compte."], "68:11": ["هَمَّازٍ مَّشَّاءٍ بِنَمِيمٍ", "(Do not obey) the slanderer who goes about spreading tales.", "(N'obéis pas au) diffamateur qui colporte la médisance."], "49:12": ["وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ", "Do not backbite one another. Would any of you like to eat the flesh of his dead brother? You would hate it.", "Ne médisez pas les uns des autres. L'un de vous aimerait-il manger la chair de son frère mort ? Vous en auriez horreur."], "2:188": ["وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ لِتَأْكُلُوا فَرِيقًا مِّنْ أَمْوَالِ النَّاسِ بِالْإِثْمِ وَأَنتُمْ تَعْلَمُونَ", "Do not consume one another's wealth unjustly, nor offer it to those in authority (as bribes) to knowingly devour a portion of people's wealth sinfully.", "Ne dévorez pas injustement les biens les uns des autres, et ne les offrez pas aux autorités (en pots-de-vin) pour dévorer sciemment une part des biens d'autrui."], "5:38": ["وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ", "As for the thief, male or female, cut off their hands as a recompense for what they earned — a deterrent from Allah.", "Le voleur et la voleuse, coupez-leur la main en rétribution de ce qu'ils ont commis, comme châtiment exemplaire de la part d'Allah."], "33:58": ["وَالَّذِينَ يُؤْذُونَ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ بِغَيْرِ مَا اكْتَسَبُوا فَقَدِ احْتَمَلُوا بُهْتَانًا وَإِثْمًا مُّبِينًا", "Those who harm believing men and women undeservedly bear the guilt of slander and a manifest sin.", "Ceux qui offensent les croyants et les croyantes sans qu'ils l'aient mérité se chargent d'une calomnie et d'un péché évident."], "3:161": ["وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ الْقِيَامَةِ", "Whoever misappropriates (public property) will come with what he took on the Day of Resurrection.", "Quiconque détourne (un bien commun) viendra avec ce qu'il a détourné au Jour de la Résurrection."], "49:13": ["يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ", "O mankind, We created you from a male and a female and made you nations and tribes to know one another. The most honoured of you with Allah is the most God-conscious.", "Ô hommes, Nous vous avons créés d'un mâle et d'une femelle et fait de vous des peuples et des tribus pour que vous vous connaissiez. Le plus noble d'entre vous auprès d'Allah est le plus pieux."], "2:275–279": ["وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا • فَإِن لَّمْ تَفْعَلُوا فَأْذَنُوا بِحَرْبٍ مِّنَ اللَّهِ وَرَسُولِهِ", "Allah has permitted trade and forbidden riba… If you do not (give it up), then be informed of war from Allah and His Messenger.", "Allah a rendu licite le commerce et illicite l'usure… Si vous ne (l'abandonnez) pas, recevez l'annonce d'une guerre de la part d'Allah et de Son Messager."], "7:56": ["وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا", "Do not spread corruption on the earth after it has been set right.", "Ne semez pas la corruption sur terre après qu'elle a été réformée."], "7:31": ["وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "Eat and drink, but do not waste; He does not love the wasteful.", "Mangez et buvez, mais sans excès ; Il n'aime pas ceux qui commettent des excès."], "30:41": ["ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ", "Corruption has appeared on land and sea because of what people's hands have earned.", "La corruption est apparue sur terre et sur mer à cause de ce que les mains des hommes ont accompli."], "2:168": ["يَا أَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا", "O mankind, eat of what is on earth, lawful and wholesome.", "Ô hommes, mangez de ce qui est sur terre, licite et pur."], "17:27": ["إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ", "Indeed, the squanderers are brothers of the devils.", "Les gaspilleurs sont les frères des diables."], "2:205": ["وَإِذَا تَوَلَّىٰ سَعَىٰ فِي الْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ الْحَرْثَ وَالنَّسْلَ وَاللَّهُ لَا يُحِبُّ الْفَسَادَ", "When he gains power, he strives to spread corruption in the land, destroying crops and livestock — and Allah does not love corruption.", "Dès qu'il détient le pouvoir, il s'active à semer la corruption sur terre, à détruire cultures et bétail — et Allah n'aime pas la corruption."], "20:14": ["وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "And establish prayer for My remembrance.", "Et accomplis la prière pour te souvenir de Moi."], "2:184": ["فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ", "Whoever of you is ill or on a journey, then an equal number of other days (to make up).", "Quiconque d'entre vous est malade ou en voyage devra jeûner un nombre égal d'autres jours."], "9:103": ["خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا", "Take from their wealth a charity to purify them and cause them to grow by it.", "Prélève de leurs biens une aumône par laquelle tu les purifies et les fais croître."], "5:89": ["فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ أَوْ كِسْوَتُهُمْ", "Its expiation is feeding ten poor people from the average of what you feed your families, or clothing them.", "L'expiation en est de nourrir dix pauvres de ce dont vous nourrissez normalement vos familles, ou de les vêtir."], "49:10": ["إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ", "The believers are but brothers, so make reconciliation between your brothers.", "Les croyants ne sont que des frères ; réconciliez donc vos frères."], "2:177": ["وَآتَى الْمَالَ عَلَىٰ حُبِّهِ ذَوِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينَ", "(Righteousness is) giving wealth, despite loving it, to relatives, orphans and the needy.", "(La piété, c'est) donner de ses biens, malgré l'amour qu'on en a, aux proches, aux orphelins et aux pauvres."], "4:36": ["وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَىٰ", "Worship Allah and associate nothing with Him, and be excellent to parents and to relatives.", "Adorez Allah sans rien Lui associer, et soyez bienfaisants envers les parents et les proches."], "17:24": ["وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "And say: My Lord, have mercy on them as they raised me when I was small.", "Et dis : Seigneur, fais-leur miséricorde comme ils m'ont élevé tout petit."], "2:274": ["الَّذِينَ يُنفِقُونَ أَمْوَالَهُم بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ", "Those who spend their wealth by night and day, secretly and openly, will have their reward with their Lord.", "Ceux qui dépensent leurs biens nuit et jour, en secret et en public, auront leur récompense auprès de leur Seigneur."], "2:280": ["وَإِن كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَن تَصَدَّقُوا خَيْرٌ لَّكُمْ", "If the debtor is in hardship, grant him time until ease; and to forgive it as charity is better for you.", "Si le débiteur est dans la gêne, accordez-lui un délai jusqu'à l'aisance ; et lui en faire remise est meilleur pour vous."], "Muslim 728": ["«مَن صَلَّى اثْنَتَيْ عَشْرَةَ رَكْعَةً فِي يَوْمٍ وَلَيْلَةٍ بُنِيَ لَهُ بِهِنَّ بَيْتٌ فِي الْجَنَّةِ»", "“Whoever prays twelve rak'ahs in a day and night, a house will be built for him in Paradise.”", "« Quiconque prie douze rak'ats en un jour et une nuit, une maison lui sera bâtie au Paradis. »"], "Muslim 2733": ["«دَعْوَةُ الْمَرْءِ الْمُسْلِمِ لِأَخِيهِ بِظَهْرِ الْغَيْبِ مُسْتَجَابَةٌ، عِنْدَ رَأْسِهِ مَلَكٌ مُوَكَّلٌ كُلَّمَا دَعَا لِأَخِيهِ بِخَيْرٍ قَالَ: آمِينَ وَلَكَ بِمِثْلٍ»", "“A Muslim's supplication for his brother in his absence is answered. An angel at his head says each time: Amin, and the same for you.”", "« L'invocation du musulman pour son frère en son absence est exaucée. Un ange à son chevet dit à chaque fois : Amin, et autant pour toi. »"], "Bukhari 6116": ["«لَا تَغْضَبْ» فَرَدَّدَ مِرَارًا، قَالَ: «لَا تَغْضَبْ»", "A man asked for advice. He ﷺ said: “Do not get angry.” He repeated it several times: “Do not get angry.”", "Un homme demanda un conseil. Il ﷺ dit : « Ne te mets pas en colère. » Il le répéta plusieurs fois."], "Bukhari 6094": ["«إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ… وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ»", "“Truthfulness leads to righteousness… and lying leads to wickedness, and wickedness leads to the Fire.”", "« La véracité mène à la piété… et le mensonge mène à la perversion, et la perversion mène au Feu. »"], "Tirmidhi 1919": ["«لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا»", "“He is not one of us who shows no mercy to our young and no respect to our elders.”", "« N'est pas des nôtres celui qui n'a pas de miséricorde pour nos petits et ne respecte pas nos aînés. »"], "Tirmidhi 3895": ["«خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ، وَأَنَا خَيْرُكُمْ لِأَهْلِي»", "“The best of you is the best to his family, and I am the best of you to my family.”", "« Le meilleur d'entre vous est le meilleur envers sa famille, et je suis le meilleur d'entre vous envers ma famille. »"], "Bukhari 676": ["سُئِلَتْ عَائِشَةُ: مَا كَانَ النَّبِيُّ ﷺ يَصْنَعُ فِي بَيْتِهِ؟ قَالَتْ: «كَانَ يَكُونُ فِي مِهْنَةِ أَهْلِهِ»", "Aisha was asked what the Prophet ﷺ did at home. She said: “He would serve his family (help with housework).”", "On demanda à Aïcha ce que faisait le Prophète ﷺ chez lui. Elle dit : « Il aidait sa famille aux tâches du foyer. »"], "Bukhari 5986": ["«مَنْ سَرَّهُ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، أَوْ يُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ»", "“Whoever would love his provision to be expanded and his life prolonged, let him maintain ties of kinship.”", "« Que celui qui aimerait voir sa subsistance élargie et sa vie prolongée entretienne ses liens de parenté. »"], "Bukhari 30": ["«إِخْوَانُكُمْ خَوَلُكُمْ… فَلْيُطْعِمْهُ مِمَّا يَأْكُلُ، وَلْيُلْبِسْهُ مِمَّا يَلْبَسُ، وَلَا تُكَلِّفُوهُمْ مَا يَغْلِبُهُمْ»", "“Those who serve you are your brothers… feed them from what you eat, clothe them from what you wear, and do not burden them beyond their ability.”", "« Ceux qui vous servent sont vos frères… nourrissez-les de ce que vous mangez, vêtez-les de ce que vous portez et ne les chargez pas au-delà de leurs forces. »"], "Bukhari 1968": ["«إِنَّ لِرَبِّكَ عَلَيْكَ حَقًّا، وَلِنَفْسِكَ عَلَيْكَ حَقًّا، وَلِأَهْلِكَ عَلَيْكَ حَقًّا، فَأَعْطِ كُلَّ ذِي حَقٍّ حَقَّهُ»", "“Your Lord has a right over you, your self has a right over you, and your family has a right over you — so give each its due.”", "« Ton Seigneur a un droit sur toi, ton âme a un droit sur toi, ta famille a un droit sur toi — donne à chacun son dû. »"], "Bukhari 2072": ["«مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ»", "“No one ever eats better food than what he earns by the work of his own hands.”", "« Personne n'a jamais mangé meilleure nourriture que celle acquise par le travail de ses mains. »"], "Bukhari 1471": ["«لَأَنْ يَأْخُذَ أَحَدُكُمْ حَبْلَهُ فَيَأْتِيَ بِحُزْمَةِ الْحَطَبِ عَلَى ظَهْرِهِ فَيَبِيعَهَا… خَيْرٌ لَهُ مِنْ أَنْ يَسْأَلَ النَّاسَ»", "“For one of you to take his rope, carry a bundle of firewood on his back and sell it… is better for him than begging from people.”", "« Que l'un de vous prenne sa corde, rapporte un fagot de bois sur son dos et le vende… vaut mieux pour lui que de mendier auprès des gens. »"], "Ibn Majah 2443": ["«أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ»", "“Give the worker his wage before his sweat dries.”", "« Donnez au travailleur son salaire avant que sa sueur ne sèche. »"], "Muslim 1631": ["«إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»", "“When a person dies, his deeds end except three: ongoing charity, beneficial knowledge, or a righteous child who prays for him.”", "« Quand l'homme meurt, ses œuvres cessent sauf trois : une aumône continue, un savoir utile, ou un enfant vertueux qui invoque pour lui. »"], "Tirmidhi 1956": ["«تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ»", "“Your smile in your brother's face is charity.”", "« Ton sourire au visage de ton frère est une aumône. »"], "Muslim 2699": ["«مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ… وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ»", "“Whoever relieves a believer of a hardship of this world, Allah will relieve him of a hardship of the Day of Resurrection… Allah helps His servant as long as the servant helps his brother.”", "« Quiconque soulage un croyant d'une détresse de ce monde, Allah le soulagera d'une détresse du Jour de la Résurrection… Allah aide Son serviteur tant que celui-ci aide son frère. »"], "Muslim 49": ["«مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ»", "“Whoever of you sees a wrong, let him change it with his hand; if he cannot, then with his tongue; if he cannot, then with his heart.”", "« Que celui d'entre vous qui voit un mal le change de sa main ; s'il ne peut pas, par sa langue ; s'il ne peut pas, par son cœur. »"], "Bukhari 1477": ["«إِنَّ اللَّهَ كَرِهَ لَكُمْ ثَلَاثًا: قِيلَ وَقَالَ، وَإِضَاعَةَ الْمَالِ، وَكَثْرَةَ السُّؤَالِ»", "“Allah dislikes three things for you: gossip (‘it was said, he said’), wasting wealth, and asking too many questions.”", "« Allah réprouve pour vous trois choses : les « on-dit », le gaspillage des biens et l'excès de questions. »"], "Bukhari 2227": ["«قَالَ اللَّهُ: ثَلَاثَةٌ أَنَا خَصْمُهُمْ يَوْمَ الْقِيَامَةِ… وَرَجُلٌ اسْتَأْجَرَ أَجِيرًا فَاسْتَوْفَى مِنْهُ وَلَمْ يُعْطِهِ أَجْرَهُ»", "“Allah said: Three I will oppose on the Day of Resurrection… and a man who hired a worker, took full work from him and did not pay his wage.”", "« Allah a dit : Trois personnes seront Mes adversaires au Jour de la Résurrection… et un homme qui a engagé un ouvrier, a obtenu de lui son travail et ne lui a pas donné son salaire. »"], "Muslim 2577": ["«يَا عِبَادِي إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا فَلَا تَظَالَمُوا»", "“O My servants, I have forbidden oppression for Myself and made it forbidden among you, so do not oppress one another.”", "« Ô Mes serviteurs, Je Me suis interdit l'injustice et l'ai rendue illicite entre vous ; ne soyez donc pas injustes les uns envers les autres. »"], "Bukhari 2654": ["«أَلَا أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ؟… الْإِشْرَاكُ بِاللَّهِ، وَعُقُوقُ الْوَالِدَيْنِ… أَلَا وَقَوْلُ الزُّورِ»", "“Shall I tell you of the greatest of major sins? … Associating partners with Allah, disobeying parents… and false speech (false testimony).”", "« Voulez-vous que je vous informe des plus grands des grands péchés ? … L'association, la désobéissance aux parents… et le faux témoignage. »"], "Muslim 1828": ["«اللَّهُمَّ مَنْ وَلِيَ مِنْ أَمْرِ أُمَّتِي شَيْئًا فَشَقَّ عَلَيْهِمْ فَاشْقُقْ عَلَيْهِ، وَمَنْ وَلِيَ مِنْ أَمْرِ أُمَّتِي شَيْئًا فَرَفَقَ بِهِمْ فَارْفُقْ بِهِ»", "“O Allah, whoever is given charge of my people's affairs and makes things hard for them, be hard on him; and whoever is gentle with them, be gentle with him.”", "« Ô Allah, quiconque est chargé d'une affaire de ma communauté et la leur rend pénible, rends-lui la vie pénible ; et quiconque est doux envers eux, sois doux envers lui. »"], "Muslim 102": ["«مَنْ غَشَّنَا فَلَيْسَ مِنَّا»", "“Whoever cheats us is not one of us.”", "« Celui qui nous trompe n'est pas des nôtres. »"], "Bukhari 7174": ["«فَهَلَّا جَلَسَ فِي بَيْتِ أَبِيهِ وَأُمِّهِ فَيَنْظُرَ أَيُهْدَى لَهُ أَمْ لَا»", "About an official who received gifts: “Why did he not sit in his father's and mother's house to see whether gifts would come to him or not?”", "À propos d'un agent qui recevait des cadeaux : « Que ne restait-il dans la maison de son père et de sa mère pour voir si on lui offrirait des cadeaux ou non ? »"], "Abu Dawud 4586": ["«مَنْ تَطَبَّبَ وَلَا يُعْلَمُ مِنْهُ طِبٌّ فَهُوَ ضَامِنٌ»", "“Whoever practises medicine without known competence is liable (for the harm).”", "« Quiconque pratique la médecine sans compétence reconnue est responsable (des dommages). »"], "Abu Dawud 2548": ["«اتَّقُوا اللَّهَ فِي هَذِهِ الْبَهَائِمِ الْمُعْجَمَةِ، فَارْكَبُوهَا صَالِحَةً، وَكُلُوهَا صَالِحَةً»", "“Fear Allah regarding these animals that cannot speak. Ride them while they are fit, and eat them while they are fit.”", "« Craignez Allah au sujet de ces bêtes muettes. Montez-les en bonne santé et mangez-les en bonne santé. »"], "Bukhari 2320": ["«مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْسًا أَوْ يَزْرَعُ زَرْعًا فَيَأْكُلُ مِنْهُ طَيْرٌ أَوْ إِنْسَانٌ أَوْ بَهِيمَةٌ إِلَّا كَانَ لَهُ بِهِ صَدَقَةٌ»", "“No Muslim plants a tree or sows a crop from which a bird, a person or an animal eats, except that it is charity for him.”", "« Nul musulman ne plante un arbre ou ne sème une culture dont mangent un oiseau, un homme ou une bête, sans que ce soit pour lui une aumône. »"], "Bukhari 2363": ["«فِي كُلِّ ذَاتِ كَبِدٍ رَطْبَةٍ أَجْرٌ»", "After the man who gave water to a thirsty dog was forgiven: “There is reward in (serving) every living creature.”", "Après le pardon de l'homme qui abreuva un chien assoiffé : « Il y a une récompense pour (le bien fait à) tout être vivant. »"], "Muslim 1914": ["«لَقَدْ رَأَيْتُ رَجُلًا يَتَقَلَّبُ فِي الْجَنَّةِ فِي شَجَرَةٍ قَطَعَهَا مِنْ ظَهْرِ الطَّرِيقِ كَانَتْ تُؤْذِي النَّاسَ»", "“I saw a man enjoying himself in Paradise because of a tree he cut down from the road that used to harm people.”", "« J'ai vu un homme jouir du Paradis à cause d'un arbre qu'il avait coupé sur la route et qui gênait les gens. »"], "Bukhari 3318": ["«عُذِّبَتِ امْرَأَةٌ فِي هِرَّةٍ سَجَنَتْهَا حَتَّى مَاتَتْ فَدَخَلَتْ فِيهَا النَّارَ، لَا هِيَ أَطْعَمَتْهَا وَلَا سَقَتْهَا… وَلَا هِيَ تَرَكَتْهَا تَأْكُلُ مِنْ خَشَاشِ الْأَرْضِ»", "“A woman was punished because of a cat she locked up until it died, and she entered the Fire for it. She neither fed it nor gave it water, nor let it eat from the creatures of the earth.”", "« Une femme fut châtiée à cause d'une chatte qu'elle enferma jusqu'à sa mort, et elle entra en Enfer. Elle ne la nourrit ni ne l'abreuva, ni ne la laissa manger les petites bêtes de la terre. »"], "Nasa'i 4446": ["«مَنْ قَتَلَ عُصْفُورًا عَبَثًا عَجَّ إِلَى اللَّهِ يَوْمَ الْقِيَامَةِ يَقُولُ: يَا رَبِّ، إِنَّ فُلَانًا قَتَلَنِي عَبَثًا وَلَمْ يَقْتُلْنِي لِمَنْفَعَةٍ»", "“Whoever kills a sparrow for sport, it will cry out to Allah on the Day of Resurrection: My Lord, so-and-so killed me for nothing, not for any benefit.”", "« Quiconque tue un moineau par jeu, celui-ci se plaindra à Allah au Jour de la Résurrection : Seigneur, untel m'a tué pour rien, et non pour une utilité. »"], "Ibn Majah 2340": ["«لَا ضَرَرَ وَلَا ضِرَارَ»", "“There is to be no harm, and no causing of harm.”", "« Ni préjudice, ni préjudice réciproque. »"], "Tirmidhi 807": ["«مَنْ فَطَّرَ صَائِمًا كَانَ لَهُ مِثْلُ أَجْرِهِ غَيْرَ أَنَّهُ لَا يَنْقُصُ مِنْ أَجْرِ الصَّائِمِ شَيْئًا»", "“Whoever gives iftar to a fasting person gets the same reward, without the fasting person's reward being reduced at all.”", "« Quiconque offre l'iftar à un jeûneur obtient la même récompense que lui, sans que celle du jeûneur ne diminue en rien. »"], "Bukhari 5027": ["«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ»", "“The best of you are those who learn the Qur'an and teach it.”", "« Les meilleurs d'entre vous sont ceux qui apprennent le Coran et l'enseignent. »"], "Bukhari 450": ["«مَنْ بَنَى مَسْجِدًا يَبْتَغِي بِهِ وَجْهَ اللَّهِ بَنَى اللَّهُ لَهُ مِثْلَهُ فِي الْجَنَّةِ»", "“Whoever builds a mosque seeking Allah's Face, Allah builds for him the like of it in Paradise.”", "« Quiconque bâtit une mosquée en recherchant la Face d'Allah, Allah lui bâtit son équivalent au Paradis. »"], "Bukhari 5304": ["«أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا» وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى", "“I and the one who cares for an orphan will be in Paradise like this” — and he held up his index and middle fingers together.", "« Moi et celui qui prend en charge un orphelin serons au Paradis comme ceci » — et il joignit l'index et le majeur."], "Bukhari 2449": ["«مَنْ كَانَتْ لَهُ مَظْلَمَةٌ لِأَخِيهِ مِنْ عِرْضِهِ أَوْ شَيْءٍ فَلْيَتَحَلَّلْهُ مِنْهُ الْيَوْمَ قَبْلَ أَنْ لَا يَكُونَ دِينَارٌ وَلَا دِرْهَمٌ»", "“Whoever has wronged his brother in his honour or anything else, let him seek his pardon today, before there is neither dinar nor dirham.”", "« Celui qui a lésé son frère dans son honneur ou en quoi que ce soit, qu'il obtienne son pardon aujourd'hui, avant qu'il n'y ait plus ni dinar ni dirham. »"], "Abu Dawud 1641": ["أَمَرَ النَّبِيُّ ﷺ رَجُلًا سَأَلَهُ أَنْ يَشْتَرِيَ قَدُومًا وَيَحْتَطِبَ وَيَبِيعَ، وَقَالَ: «هَذَا خَيْرٌ لَكَ مِنْ أَنْ تَجِيءَ الْمَسْأَلَةُ نُكْتَةً فِي وَجْهِكَ يَوْمَ الْقِيَامَةِ»", "A man came begging; the Prophet ﷺ sold some of his belongings, had him buy an axe and gather firewood to sell, and said: “This is better for you than begging coming as a mark on your face on the Day of Resurrection.”", "Un homme vint mendier ; le Prophète ﷺ vendit certains de ses biens, lui fit acheter une hache pour couper et vendre du bois, et dit : « Cela vaut mieux pour toi que la mendicité qui viendrait comme une marque sur ton visage au Jour de la Résurrection. »"], "Abu Dawud 1681": ["قَالَ سَعْدٌ: يَا رَسُولَ اللَّهِ، أَيُّ الصَّدَقَةِ أَعْجَبُ إِلَيْكَ؟ قَالَ: «الْمَاءُ»", "Sa'd asked: “O Messenger of Allah, which charity is best?” He said: “Water.” So Sa'd dug a well.", "Sa'd demanda : « Ô Messager d'Allah, quelle aumône est la meilleure ? » Il dit : « L'eau. » Sa'd creusa alors un puits."], "Muslim 35": ["«الْإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً… وَأَدْنَاهَا إِمَاطَةُ الْأَذَى عَنِ الطَّرِيقِ»", "“Faith has over seventy branches… the least of them is removing harm from the road.”", "« La foi comporte plus de soixante-dix branches… la moindre est d'ôter ce qui nuit du chemin. »"]};
const SURA={"2": ["البقرة", "Al-Baqarah"], "3": ["آل عمران", "Āl ʿImrān"], "4": ["النساء", "An-Nisāʾ"], "5": ["المائدة", "Al-Māʾidah"], "7": ["الأعراف", "Al-Aʿrāf"], "8": ["الأنفال", "Al-Anfāl"], "9": ["التوبة", "At-Tawbah"], "17": ["الإسراء", "Al-Isrāʾ"], "20": ["طه", "Ṭā-Hā"], "23": ["المؤمنون", "Al-Muʾminūn"], "24": ["النور", "An-Nūr"], "25": ["الفرقان", "Al-Furqān"], "30": ["الروم", "Ar-Rūm"], "31": ["لقمان", "Luqmān"], "32": ["السجدة", "As-Sajdah"], "33": ["الأحزاب", "Al-Aḥzāb"], "38": ["ص", "Ṣād"], "47": ["محمد", "Muḥammad"], "49": ["الحجرات", "Al-Ḥujurāt"], "63": ["المنافقون", "Al-Munāfiqūn"], "68": ["القلم", "Al-Qalam"], "74": ["المدثر", "Al-Muddaththir"], "83": ["المطففين", "Al-Muṭaffifīn"], "103": ["العصر", "Al-ʿAṣr"], "107": ["الماعون", "Al-Māʿūn"]};
const HCOL={Bukhari:["Sahih al-Bukhari","صحيح البخاري","Sahih al-Bukhari"],Muslim:["Sahih Muslim","صحيح مسلم","Sahih Muslim"],Tirmidhi:["Jami' at-Tirmidhi","سنن الترمذي","Jami' at-Tirmidhi"],"Abu Dawud":["Sunan Abi Dawud","سنن أبي داود","Sunan Abi Dawud"],"Ibn Majah":["Sunan Ibn Majah","سنن ابن ماجه","Sunan Ibn Majah"],"Nasa'i":["Sunan an-Nasa'i","سنن النسائي","Sunan an-Nasa'i"]};
function citeKey(ref){const ps=(ref||"").split(" · ").map(x=>x.trim()).filter(Boolean);return ps.find(x=>/^\d+:\d/.test(x))||ps[0]||""}
function cite(ref){
  const k=citeKey(ref),t=REFT[k];if(!k)return"";
  const li=S.lang==="ar"?1:S.lang==="fr"?2:0;let lbl;const m=k.match(/^(\d+):(.+)$/);
  if(m){const su=SURA[m[1]]||["",""];lbl=S.lang==="ar"?`📖 سورة ${su[0]} <bdi dir="ltr">${m[1]}:${m[2]}</bdi>`:`📖 ${S.lang==="fr"?"Coran — Sourate":"Qur'an — Surah"} ${su[1]} <bdi dir="ltr">${m[1]}:${m[2]}</bdi>`}
  else{let h=k;for(const c in HCOL){if(k.startsWith(c)){h=HCOL[c][li]+k.slice(c.length);break}}lbl="📜 "+h}
  return `<div class="cite"><div class="cl">${lbl}</div>${t?`<div class="ca" dir="rtl" lang="ar">${m?"﴿"+t[0]+"﴾":t[0]}</div>${li?"":`<div class="ce">${t[1]}</div>`}${li===2?`<div class="ce">${t[2]}</div>`:""}`:""}</div>`;
}
function refLinks(ref){
  const li=S.lang==="ar"?2:S.lang==="fr"?3:1,qn={en:"Qur'an",ar:"القرآن",fr:"Coran"}[S.lang];
  return ref.split(" · ").map(r=>{r=r.trim();let m;
    if(m=r.match(/^(\d+):(\d+)(?:[–-](\d+))?/)){const v=m[3]?`${m[2]}-${m[3]}`:m[2];return `<a class="reflink" href="https://quran.com/${m[1]}/${v}" target="_blank" rel="noopener">📖 ${qn} <bdi dir="ltr">${esc(r)}</bdi></a>`}
    for(const k in COLL){if(r.startsWith(k)){const c=COLL[k],n=(r.slice(k.length).match(/\d+/)||[])[0];
      return n?`<a class="reflink" href="https://sunnah.com/${c[0]}:${n}" target="_blank" rel="noopener">📜 ${c[li]} ${n}</a>`:`<span class="reflink">📜 ${c[li]}${esc(r.slice(k.length))}</span>`}}
    return `<span class="reflink">${esc(r)}</span>`}).join("");
}
function showRef(id){const i=BY[id],l=L();modal(`<div class="modal mini"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:22px">${i.em}</span><b style="flex:1;font-size:15px">${esc(nm(i))}</b><button class="icbtn" data-act="close" style="width:30px;height:30px">✕</button></div>${i.t==="wajib"?`<div class="small" style="margin:10px 0 0"><b style="color:var(--wajib)">✓ ${fmt(i.pts)}</b> · <b style="color:var(--kabaira)">✗ ${fmt(i.miss)}</b></div>${WHY[id]?`<p style="margin:8px 0 0;font-size:13.5px;line-height:1.55">${WHY[id][S.lang]}</p>`:""}`:""}${cite(i.ref)}</div>`)}
/* ============ overlays ============ */
const layer=document.getElementById("layer");
function modal(html){layer.innerHTML=`<div class="ov" data-ov>${html}</div>`}
function close(){layer.innerHTML=""}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function showIntro(){const l=L();modal(`<div class="modal" style="text-align:center">${LOGO.replace('class="logo"','class="logo" style="width:64px;height:64px"')}<h3 style="margin-top:8px">${l.introT}</h3><p>${l.introB}</p>
 <div class="row" style="justify-content:center;margin-top:14px">${[["en","English"],["ar","العربية"],["fr","Français"]].map(([g,n])=>`<button class="btn ${S.lang===g?"gold":""}" data-lang="${g}">${n}</button>`).join("")}</div>
 <div class="est" style="text-align:start;margin-top:14px">${l.est}</div><p class="small" style="margin-top:10px">${l.privacy}</p><div class="row" style="justify-content:center"><button class="btn gold" data-act="begin" style="padding:12px 30px">${l.begin}</button></div></div>`)}
function showLock(){const l=L();layer.innerHTML=`<div class="lock"><div class="box">${LOGO.replace('class="logo"','class="logo" style="width:72px;height:72px"')}<h2 style="font-family:var(--fh);font-size:30px;color:var(--gold2)">${l.app}</h2><p class="small">${l.enter}</p>
 <input class="inp" id="unpin" type="password" inputmode="numeric" maxlength="8" autofocus><button class="btn gold" data-act="unlock">${l.unlock}</button><p class="small" id="lockmsg"></p></div></div>`;setTimeout(()=>{const e=document.getElementById("unpin");e&&e.focus()},50)}
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hasanat:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of "hasanat:"+p)h=(h*31+c.charCodeAt(0))|0;return "x"+h}}
async function tryUnlock(){const e=document.getElementById("unpin");if(!e)return;if(await hash(e.value)===S.pin){unlocked=true;close();render()}else{e.value="";e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");document.getElementById("lockmsg").textContent=L().wrong}}

function askKabira(id){const l=L(),i=BY[id];modal(`<div class="modal"><h3>${i.em} ${l.recT}</h3><p style="color:var(--ink);font-weight:600;font-size:15px">${esc(nm(i))} <span class="pts" style="background:rgba(255,93,108,.15);color:var(--kabaira);padding:2px 8px;border-radius:99px;font-size:12px">${fmt(i.pts)}</span></p>
 ${i.ref?cite(i.ref):""}<p>${l.recB}</p>${i.p==="f"||id==="harass"?`<div class="safety" style="margin:12px 0 0;font-size:12.5px">${l.safety}</div>`:""}
 <div class="row"><button class="btn" data-act="close">${l.cancel}</button><button class="btn red" data-act="dokab" data-id="${id}" style="background:rgba(255,93,108,.15)">${l.rec}</button></div></div>`)}

/* ============ actions ============ */
function setW(id,k){const d=ensure(cur),o=k==="c"?"x":"c";if(d[k][id]){delete d[k][id]}else{d[k][id]=1;delete d[o][id]}save();render()}
function bump(id,n){const d=ensure(cur);const it=BY[id];let v=(d.c[id]||0)+n;if(it.t==="wajib")v=v>0?1:0;if(v<=0){delete d.c[id];delete d.r[id]}else d.c[id]=Math.min(v,99);save();render()}

document.addEventListener("click",async e=>{
  const rf=e.target.closest("[data-ref]");if(rf){e.stopPropagation();showRef(rf.dataset.ref);return}
  if(e.target.closest("a.reflink"))return;
  const el=e.target.closest("[data-done],[data-miss],[data-tab],[data-lang],[data-act],[data-item],[data-minus],[data-filter],[data-rep],[data-ov]");if(!el)return;
  if(el.dataset.ov!==undefined&&e.target===el&&S.intro&&unlocked){close();return}
  if(el.dataset.ov!==undefined)return;
  if(el.dataset.tab){view=el.dataset.tab;try{history.replaceState(null,"","#"+view)}catch(_){location.hash=view}render();scrollTo({top:0,behavior:"smooth"});return}
  if(el.dataset.lang){S.lang=el.dataset.lang;save();render();return}
  if(el.dataset.filter){filter=el.dataset.filter;render();return}
  if(el.dataset.minus){e.stopPropagation();bump(el.dataset.minus,-1);return}
  if(el.dataset.done||el.dataset.miss){e.stopPropagation();setW(el.dataset.done||el.dataset.miss,el.dataset.done?"c":"x");return}
  if(el.dataset.item){const id=el.dataset.item,it=BY[id];const d=day(cur);
    if(it.t==="wajib"){setW(id,"c");return}
    if(it.t==="kabaira"){askKabira(id);return}
    bump(id,1);return}
  if(el.dataset.rep){const d=ensure(cur);const r=d.r[el.dataset.rep]||(d.r[el.dataset.rep]={});r[el.dataset.k]=!r[el.dataset.k];save();render();return}
  const a=el.dataset.act,l=L();
  if(a==="prev"){cur=shift(cur,-1);render()}
  else if(a==="next"){if(cur<dkey(new Date())){cur=shift(cur,1);render()}}
  else if(a==="close")close();
  else if(a==="goresults"){const x=document.getElementById("results");x&&x.scrollIntoView({behavior:"smooth"})}
  else if(a==="goislah"){const x=document.getElementById("tier-islah");x&&x.scrollIntoView({behavior:"smooth"})}
  else if(a==="begin"){S.intro=true;save();close()}
  else if(a==="dokab"){close();bump(el.dataset.id,1)}
  else if(a==="lock"){unlocked=false;showLock()}
  else if(a==="unlock")tryUnlock();
  else if(a==="setpin"){const v=(document.getElementById("pin").value||"").trim();if(!/^\d{4,8}$/.test(v)){toast(l.pinPh);return}S.pin=await hash(v);save();toast(l.pinSet);render()}
  else if(a==="rmpin"){S.pin=null;save();toast(l.pinOff);render()}
  else if(a==="copy"){const data=JSON.stringify({app:"hasanat-score",v:1,days:S.days,lang:S.lang});
    try{await navigator.clipboard.writeText(data);toast(l.copied)}catch(_){const p=document.getElementById("paste");p.value=data;p.select();toast("⌘/Ctrl + C")}}
  else if(a==="restore")restoreFrom(document.getElementById("paste").value);
  else if(a==="erase")modal(`<div class="modal"><h3>🗑️ ${l.eraseT}</h3><p>${l.sure}</p><div class="row"><button class="btn" data-act="close">${l.cancel}</button><button class="btn red" data-act="doerase">${l.yes}</button></div></div>`);
  else if(a==="doerase"){S.days={};S.pin=null;save();close();toast(l.erased);render()}
});
function restoreFrom(txt){const l=L();try{const o=JSON.parse(txt);if(!o||typeof o.days!=="object")throw 0;S.days=o.days;if(o.lang)S.lang=o.lang;save();toast(l.restoredOk);render()}catch(_){toast(l.invalid)}}
document.addEventListener("change",e=>{if(e.target.id==="file"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f)}});
document.addEventListener("input",e=>{if(e.target.id==="note"){ensure(cur).note=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="unpin")tryUnlock();if(e.key==="Escape"&&unlocked&&S.intro)close()});
addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["today","mizan","kabair","settings"].includes(v)&&v!==view){view=v;render()}});
render();
</script>
</body>
</html>
